<svg xmlns="http://www.w3.org/2000/svg" width="640" height="498" viewBox="0 0 640 498">
<rect width="100%" height="100%" rx="16" fill="#f1e5cd"/>
<text x="28" y="40" fill="#8a382b" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">LOCATION</text>
<text x="28" y="74" fill="#30291f" font-family="DejaVu Sans Mono, monospace" font-size="24" xml:space="preserve">Glass Harbor</text>
<text x="28" y="100" fill="#6c5940" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">EXAMPLE ONLY · fictional, not campaign canon</text>
<text x="28" y="126" fill="#6c5940" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">example · fictional · coast</text>
<text x="28" y="152" fill="#6c5940" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="178" fill="#8a382b" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Atmosphere</text>
<text x="28" y="204" fill="#30291f" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">At low tide the black sand glitters with </text>
<text x="28" y="230" fill="#30291f" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">fragments of blue glass.</text>
<text x="28" y="256" fill="#6c5940" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="282" fill="#8a382b" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Features</text>
<text x="28" y="308" fill="#30291f" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">A leaning beacon; an abandoned customs house; </text>
<text x="28" y="334" fill="#30291f" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">rope bridges over tidal pools.</text>
<text x="28" y="360" fill="#6c5940" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="386" fill="#8a382b" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Hook</text>
<text x="28" y="412" fill="#30291f" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Each dawn, a sealed bottle appears on the same </text>
<text x="28" y="438" fill="#30291f" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">empty pier. Today it contains a map of </text>
<text x="28" y="464" fill="#30291f" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">tomorrow&#x27;s wreck.</text></svg>