<text x="28" y="516" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">+4 Lore; +3 Investigate, Rapport; +2 Notice, </text>
<text x="28" y="542" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Will, Crafts; +1 Physique, Athletics, Empathy, </text>
