<text x="28" y="906" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Physical [1][2][3]; mental [1][2][3]. Mark at </text>
<text x="28" y="932" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">most one box per hit; consequences may also </text>
