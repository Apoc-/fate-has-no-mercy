<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1148" viewBox="0 0 640 1148">
<rect width="100%" height="100%" rx="16" fill="#181d27"/>
<text x="28" y="40" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">NOTE</text>
<text x="28" y="74" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="24" xml:space="preserve">The Auction of the Missing Hour</text>
<text x="28" y="100" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Scene · Active scene frame · social tension </text>
<text x="28" y="126" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">before violence</text>
<text x="28" y="152" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">GM DEMO · NOT CANON</text>
<text x="28" y="178" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="204" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Opening / stakes</text>
<text x="28" y="230" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">An unnamed hour is auctioned in a glass </text>
<text x="28" y="256" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">cylinder. Nera sees her witness stamp on its </text>
<text x="28" y="282" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">base. Can the party learn who consigned it </text>
<text x="28" y="308" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">without exposing her as the source?</text>
<text x="28" y="334" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="360" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">People / goals</text>
<text x="28" y="386" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Vale&#x27;s broker wants a quiet sale. Nera wants the</text>
<text x="28" y="412" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> stamp preserved. Lark wants the buyer list. The</text>
<text x="28" y="438" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> PCs choose what matters to them.</text>
<text x="28" y="464" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="490" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Situation aspects</text>
<text x="28" y="516" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Every Bid Names a Debtor; Glass Carries Every </text>
<text x="28" y="542" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Whisper; A Bell Already Drawing Breath. Zero </text>
<text x="28" y="568" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">free invokes initially unless established </text>
<text x="28" y="594" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">preparation earns them.</text>
<text x="28" y="620" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="646" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Zones / connections</text>
<text x="28" y="672" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Auction Floor connects to Observer Gallery by a </text>
<text x="28" y="698" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">guarded stair. Gallery connects to Cylinder </text>
<text x="28" y="724" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Vault by a locked service door; a maintenance </text>
<text x="28" y="750" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">hatch offers an alternative route.</text>
<text x="28" y="776" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="802" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Play structure</text>
<text x="28" y="828" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Start with ordinary roleplay and relevant </text>
<text x="28" y="854" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">overcome/create-advantage actions. Use a contest</text>
<text x="28" y="880" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> if parties race to secure the lot; use a </text>
<text x="28" y="906" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">conflict only if they become able and willing to</text>
<text x="28" y="932" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> harm one another.</text>
<text x="28" y="958" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="984" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Pressure / exits</text>
<text x="28" y="1010" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">At the warning chime the broker seals the </text>
<text x="28" y="1036" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">cylinder for delivery. PCs may buy access, </text>
<text x="28" y="1062" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">reveal an inconsistency, steal the stamp, </text>
<text x="28" y="1088" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">bargain with the buyer, or pursue an approach </text>
<text x="28" y="1114" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">not listed here.</text></svg>