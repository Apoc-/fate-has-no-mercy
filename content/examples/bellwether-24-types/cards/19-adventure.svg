<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1330" viewBox="0 0 640 1330">
<rect width="100%" height="100%" rx="16" fill="#181d27"/>
<text x="28" y="40" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">NOTE</text>
<text x="28" y="74" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="24" xml:space="preserve">The Night Without Tomorrow</text>
<text x="28" y="100" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Adventure · One-session adventure · three </text>
<text x="28" y="126" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">connected nodes</text>
<text x="28" y="152" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">GM DEMO · NOT CANON</text>
<text x="28" y="178" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="204" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Entry</text>
<text x="28" y="230" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Nera brings the party a roll bearing their names</text>
<text x="28" y="256" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> and an unsigned collection warrant. At the </text>
<text x="28" y="282" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">thirteenth bell the engine will act on it unless</text>
<text x="28" y="308" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> someone intervenes.</text>
<text x="28" y="334" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="360" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Node 1 · Archive</text>
<text x="28" y="386" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Compare receipt times, meet Pell and locate the </text>
<text x="28" y="412" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">consent rule. Leads point to Nera&#x27;s stamp at the</text>
<text x="28" y="438" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> auction and Ansel&#x27;s authority at the Office.</text>
<text x="28" y="464" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="490" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Node 2 · Auction</text>
<text x="28" y="516" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Secure the witness stamp, a broker&#x27;s delivery </text>
<text x="28" y="542" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">note or a buyer willing to testify. Each can </text>
<text x="28" y="568" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">connect Vale to the engine without requiring a </text>
<text x="28" y="594" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">specific theft or purchase.</text>
<text x="28" y="620" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="646" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Node 3 · Engine / Office</text>
<text x="28" y="672" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Choose a covert intervention, a lawful stay or a</text>
<text x="28" y="698" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> public confrontation. The hound guards one </text>
<text x="28" y="724" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">route; the maintenance channel and audit route </text>
<text x="28" y="750" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">remain alternatives.</text>
<text x="28" y="776" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="802" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">If unopposed / timeline</text>
<text x="28" y="828" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">23:50 warning chime; 00:00 records transfer; </text>
<text x="28" y="854" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">00:10 special thirteenth bell collects the </text>
<text x="28" y="880" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">forged debt; 00:15 the purist cell attempts to </text>
<text x="28" y="906" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">burn the Archive index. Forewarning gives the </text>
<text x="28" y="932" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">PCs room to change any event.</text>
<text x="28" y="958" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="984" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Possible resolutions</text>
<text x="28" y="1010" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Suspend the illegal roll and seek informed </text>
<text x="28" y="1036" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">voluntary replacement loans; isolate the </text>
<text x="28" y="1062" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">hospital reserve before disabling collection; </text>
<text x="28" y="1088" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">expose Vale and demand an emergency civic vote. </text>
<text x="28" y="1114" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Reward unexpected workable solutions, not only </text>
<text x="28" y="1140" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">these examples.</text>
<text x="28" y="1166" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="1192" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Aftermath</text>
<text x="28" y="1218" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Who now controls the reserve? Which witnesses </text>
<text x="28" y="1244" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">trust the PCs? End on changed relationships and </text>
<text x="28" y="1270" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">a remaining issue; do not force a predetermined </text>
<text x="28" y="1296" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">ending.</text></svg>