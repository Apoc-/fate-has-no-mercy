<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1330" viewBox="0 0 640 1330">
<rect width="100%" height="100%" rx="16" fill="#181d27"/>
<text x="28" y="40" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">NOTE</text>
<text x="28" y="74" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="24" xml:space="preserve">Bellwether</text>
<text x="28" y="100" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Setting · Urban clockpunk fantasy setting pitch</text>
<text x="28" y="126" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">GM DEMO · NOT CANON</text>
<text x="28" y="152" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="178" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Premise</text>
<text x="28" y="204" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">A cliffside city powers its hospitals, lifts and</text>
<text x="28" y="230" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> night markets with voluntarily borrowed hours. </text>
<text x="28" y="256" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Signed time-debts are tangible records, and </text>
<text x="28" y="282" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">their collection changes what people can do with</text>
<text x="28" y="308" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> their coming days.</text>
<text x="28" y="334" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="360" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Current issue</text>
<text x="28" y="386" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">The City Runs on Borrowed Tomorrows: useful </text>
<text x="28" y="412" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">public infrastructure depends on debts whose </text>
<text x="28" y="438" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">consent is no longer trustworthy.</text>
<text x="28" y="464" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="490" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Impending issue / timeline</text>
<text x="28" y="516" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">The Thirteenth Bell Will Collect from the </text>
<text x="28" y="542" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Unwilling. The warning sounds at 23:50, records </text>
<text x="28" y="568" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">transfer at midnight, the special thirteenth </text>
<text x="28" y="594" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">collection bell sounds at 00:10, and the purist </text>
<text x="28" y="620" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">cell plans its attack for 00:15. These are </text>
<text x="28" y="646" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">threatened events the PCs can change.</text>
<text x="28" y="672" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="698" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Faces / forces</text>
<text x="28" y="724" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Nera Quill offers testimony; Vale offers </text>
<text x="28" y="750" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">stability at a human cost; the Unwritten offers </text>
<text x="28" y="776" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">freedom with an internal argument over evidence </text>
<text x="28" y="802" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">and destruction.</text>
<text x="28" y="828" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="854" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Places / technology</text>
<text x="28" y="880" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">The Archive hangs below the tower; bellwind </text>
<text x="28" y="906" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">skiffs cross the upper lanes; the hospital </text>
<text x="28" y="932" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">reserve is physically separable from the </text>
<text x="28" y="958" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">collection engine. Magic records events but is </text>
<text x="28" y="984" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">not automatic mind-reading or prophecy.</text>
<text x="28" y="1010" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="1036" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">PC invitation</text>
<text x="28" y="1062" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Who once lent you an hour? Whose name would you </text>
<text x="28" y="1088" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">risk your future to protect? Pick an answer </text>
<text x="28" y="1114" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">together and connect it to another PC.</text>
<text x="28" y="1140" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="1166" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Tone / boundaries</text>
<text x="28" y="1192" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Street-level wonder, civic intrigue and </text>
<text x="28" y="1218" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">difficult bargains, not mandatory grimdark. </text>
<text x="28" y="1244" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Agree comfort with debt, lost time and </text>
<text x="28" y="1270" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">institutional coercion before play. All fiction </text>
<text x="28" y="1296" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">here is a new proposal.</text></svg>