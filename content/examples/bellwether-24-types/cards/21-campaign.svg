<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1304" viewBox="0 0 640 1304">
<rect width="100%" height="100%" rx="16" fill="#181d27"/>
<text x="28" y="40" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">NOTE</text>
<text x="28" y="74" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="24" xml:space="preserve">A Season of Stolen Tomorrows</text>
<text x="28" y="100" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Campaign · Campaign framework · open </text>
<text x="28" y="126" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">consequences, not a fixed plot</text>
<text x="28" y="152" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">GM DEMO · NOT CANON</text>
<text x="28" y="178" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="204" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Campaign question</text>
<text x="28" y="230" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Can Bellwether keep its life-saving wonders </text>
<text x="28" y="256" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">without allowing anyone to own another person&#x27;s </text>
<text x="28" y="282" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">future?</text>
<text x="28" y="308" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="334" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Arc 1 · Consent</text>
<text x="28" y="360" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Begin with The Night Without Tomorrow. Follow </text>
<text x="28" y="386" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">the forged roll and decide what proof, people </text>
<text x="28" y="412" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">and infrastructure to preserve.</text>
<text x="28" y="438" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="464" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Arc 2 · Dependence</text>
<text x="28" y="490" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Explore who profits from lawful loans as well as</text>
<text x="28" y="516" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> fraud. Neighboring districts offer rival </text>
<text x="28" y="542" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">solutions; the Unwritten and Office can split, </text>
<text x="28" y="568" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">reform or cooperate according to play.</text>
<text x="28" y="594" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="620" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Arc 3 · Ownership</text>
<text x="28" y="646" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Confront the founding compact behind the tower. </text>
<text x="28" y="672" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">The future debt holder in Ira&#x27;s trouble can </text>
<text x="28" y="698" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">emerge through player agreement; their identity </text>
<text x="28" y="724" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">and solution are not pre-scripted.</text>
<text x="28" y="750" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="776" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Moving interests</text>
<text x="28" y="802" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Vale seeks a legacy or escape; the rescue wing </text>
<text x="28" y="828" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">protects people; the purists target records; </text>
<text x="28" y="854" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">hospital staff need a functioning reserve. </text>
<text x="28" y="880" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Advance plans only when the fiction and PCs&#x27; </text>
<text x="28" y="906" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">choices warrant it.</text>
<text x="28" y="932" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="958" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Milestones</text>
<text x="28" y="984" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Use Core milestones at appropriate fiction-</text>
<text x="28" y="1010" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">driven points: minor opportunities to adjust a </text>
<text x="28" y="1036" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">character, significant milestones for </text>
<text x="28" y="1062" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">scenario/arc development, major milestones for </text>
<text x="28" y="1088" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">major changes. Apply the actual advancement </text>
<text x="28" y="1114" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">rules, not automatic rewards per session.</text>
<text x="28" y="1140" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="1166" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Ending space</text>
<text x="28" y="1192" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">A reformed utility, decentralized time commons, </text>
<text x="28" y="1218" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">a city that abandons the tower, or a costly new </text>
<text x="28" y="1244" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">compact are all possible. Let decisions </text>
<text x="28" y="1270" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">establish the outcome.</text></svg>