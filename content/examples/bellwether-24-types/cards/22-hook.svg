<svg xmlns="http://www.w3.org/2000/svg" width="640" height="992" viewBox="0 0 640 992">
<rect width="100%" height="100%" rx="16" fill="#181d27"/>
<text x="28" y="40" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">NOTE</text>
<text x="28" y="74" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="24" xml:space="preserve">Your Name, Tomorrow&#x27;s Roll</text>
<text x="28" y="100" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Hook · Immediate actionable opening</text>
<text x="28" y="126" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">GM DEMO · NOT CANON</text>
<text x="28" y="152" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="178" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Say at the table</text>
<text x="28" y="204" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">A woman in a red collector&#x27;s coat puts a warrant</text>
<text x="28" y="230" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> on your table. Your name is beneath tomorrow&#x27;s </text>
<text x="28" y="256" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">date. The consent signature is not yours. &#x27;I </text>
<text x="28" y="282" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">delivered one of these yesterday,&#x27; she says. &#x27;I </text>
<text x="28" y="308" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">won&#x27;t deliver this one.&#x27;</text>
<text x="28" y="334" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="360" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Offer / urgency</text>
<text x="28" y="386" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Nera offers the duplicate and a way into the </text>
<text x="28" y="412" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">auction gallery if the PCs protect her </text>
<text x="28" y="438" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">testimony. The warning chime sounds before </text>
<text x="28" y="464" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">midnight; the collection is later, at the </text>
<text x="28" y="490" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">thirteenth bell.</text>
<text x="28" y="516" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="542" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Choices</text>
<text x="28" y="568" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Verify the warrant, protect Nera, approach the </text>
<text x="28" y="594" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Office, investigate the debtor named beside you,</text>
<text x="28" y="620" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> or refuse and seek another way to keep your </text>
<text x="28" y="646" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">name off the roll.</text>
<text x="28" y="672" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="698" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">If declined</text>
<text x="28" y="724" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Nera approaches auditor Ansel. Her attempt can </text>
<text x="28" y="750" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">change the situation without forcing the PCs to </text>
<text x="28" y="776" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">accept the job or punishing refusal with </text>
<text x="28" y="802" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">unavoidable failure.</text>
<text x="28" y="828" fill="#aeb8cc" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="854" fill="#dfb879" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">GM placement</text>
<text x="28" y="880" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Connect a borrowed hour or named debtor to a PC </text>
<text x="28" y="906" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">only with player agreement. The forged signature</text>
<text x="28" y="932" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> is a problem to investigate, not permission to </text>
<text x="28" y="958" fill="#eef0f5" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">rewrite a character&#x27;s agreed past.</text></svg>