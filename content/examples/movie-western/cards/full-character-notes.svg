<svg xmlns="http://www.w3.org/2000/svg" width="640" height="888" viewBox="0 0 640 888">
<rect width="100%" height="100%" rx="16" fill="#f2e2bf"/>
<text x="28" y="40" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">CHARACTER</text>
<text x="28" y="74" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="24" xml:space="preserve">Elena »Falke« Marlow</text>
<text x="28" y="100" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Full Character / PC · Stunts / GM Notes</text>
<text x="28" y="126" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Movie Western · GM</text>
<text x="28" y="152" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="178" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Stunt · Ruhige Hand</text>
<text x="28" y="204" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">+2 auf Shoot für Attack gegen ein entferntes </text>
<text x="28" y="230" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Ziel aus einer festen, gedeckten Position, </text>
<text x="28" y="256" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">sofern Elena in dieser Exchange ihre Position </text>
<text x="28" y="282" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">nicht gewechselt hat. Kein allgemeiner Bonus auf</text>
<text x="28" y="308" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> jeden Schuss.</text>
<text x="28" y="334" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="360" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Stunt · Bevor der Staub sich legt</text>
<text x="28" y="386" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">+2 auf Notice für Create an Advantage, wenn </text>
<text x="28" y="412" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Elena bei einer offenen bewaffneten </text>
<text x="28" y="438" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Konfrontation gezielt die Waffenhand eines </text>
<text x="28" y="464" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">sichtbaren Gegenübers beobachtet. Der Vorteil </text>
<text x="28" y="490" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">und seine Free Invokes folgen dem normalen </text>
<text x="28" y="516" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Ergebnis der Action.</text>
<text x="28" y="542" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="568" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Stunt · Diese Tür bleibt zu</text>
<text x="28" y="594" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">+2 auf Fight für Defend gegen einen </text>
<text x="28" y="620" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Nahkampfangriff, während Elena einen engen </text>
<text x="28" y="646" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Durchgang körperlich versperrt. Gilt nicht gegen</text>
<text x="28" y="672" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> Shoot und nicht im freien Gelände.</text>
<text x="28" y="698" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="724" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Opening Choice</text>
<text x="28" y="750" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Clara bietet Elena die Abschrift, aber verlangt </text>
<text x="28" y="776" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">zuerst ein Versprechen für Tom. Elena kann </text>
<text x="28" y="802" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Schutz zusagen, Beweise getrennt sichern oder </text>
<text x="28" y="828" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Vane öffentlich auf seine frühere Hilfe </text>
<text x="28" y="854" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">ansprechen. Die Entscheidung gehört dem Spieler.</text></svg>