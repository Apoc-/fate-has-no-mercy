<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1512" viewBox="0 0 640 1512">
<rect width="100%" height="100%" rx="16" fill="#f2e2bf"/>
<text x="28" y="40" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">CHARACTER</text>
<text x="28" y="74" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="24" xml:space="preserve">Elena »Falke« Marlow</text>
<text x="28" y="100" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Full Character / PC · Profile / Mechanics</text>
<text x="28" y="126" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Movie Western · GM</text>
<text x="28" y="152" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="178" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">High Concept</text>
<text x="28" y="204" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Ehemalige Gesetzeshüterin mit einem zu langen </text>
<text x="28" y="230" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Gedächtnis</text>
<text x="28" y="256" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="282" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Trouble</text>
<text x="28" y="308" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Ich schulde dem falschen Mann mein Leben</text>
<text x="28" y="334" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="360" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Relationship</text>
<text x="28" y="386" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Dein Alibi ist auch meines. Vorschlag für die </text>
<text x="28" y="412" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Verbindung zu einem anderen PC: Elena gab dieser</text>
<text x="28" y="438" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> Person ein Alibi, das beide gefährden würde, </text>
<text x="28" y="464" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">wenn die Wahrheit herauskäme. Partner und </text>
<text x="28" y="490" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Einzelheiten beim Spielstart gemeinsam </text>
<text x="28" y="516" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">festlegen; kein anderer PC wird vorgegeben.</text>
<text x="28" y="542" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="568" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Free Aspect 1 / Free Aspect 2</text>
<text x="28" y="594" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Mein Wort gilt länger als mein Abzeichen / Ich </text>
<text x="28" y="620" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">schieße nicht für fremde Rechnungen</text>
<text x="28" y="646" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="672" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Personality / Goal</text>
<text x="28" y="698" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Elena wirkt still, nicht kalt: Sie merkt sich </text>
<text x="28" y="724" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Namen und gibt Zurückweichenden Raum. Sie will </text>
<text x="28" y="750" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">die Zeugen und den Beleg nach Mercy Crossing </text>
<text x="28" y="776" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">bringen, bevor Vane aus einem Diebstahl ein </text>
<text x="28" y="802" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">offizielles Versehen macht.</text>
<text x="28" y="828" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="854" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Background / Boundary</text>
<text x="28" y="880" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Nach einer vertuschten Erschießung legte sie ihr</text>
<text x="28" y="906" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> Abzeichen ab. Vane bezahlte damals ihren Arzt; </text>
<text x="28" y="932" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">sie weiß noch nicht, ob er sie aus </text>
<text x="28" y="958" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Menschlichkeit oder als spätere Schuldnerin </text>
<text x="28" y="984" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">rettete. Sie schießt weder auf Wehrlose noch auf</text>
<text x="28" y="1010" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> Menschen, die bereits aufgeben.</text>
<text x="28" y="1036" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="1062" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Skills</text>
<text x="28" y="1088" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Great (+4): Shoot. Good (+3): Fight, Notice. </text>
<text x="28" y="1114" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Fair (+2): Athletics, Will, Rapport. Average </text>
<text x="28" y="1140" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">(+1): Physique, Crafts, Empathy, Investigate. </text>
<text x="28" y="1166" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Unlisted +0.</text>
<text x="28" y="1192" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="1218" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Physical Stress / Mental Stress</text>
<text x="28" y="1244" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Physical [1][1][1][1] aus Physique +1. Mental </text>
<text x="28" y="1270" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">[1][1][1][1] aus Will +2. Jedes Kästchen fängt 1</text>
<text x="28" y="1296" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> Shift ab; mehrere dürfen denselben Treffer </text>
<text x="28" y="1322" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">abfangen.</text>
<text x="28" y="1348" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="1374" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Consequences / Refresh</text>
<text x="28" y="1400" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">mild 2 [empty]; moderate 4 [empty]; severe 6 </text>
<text x="28" y="1426" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">[empty], gemeinsame Slots. Refresh 3; drei freie</text>
<text x="28" y="1452" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> Stunts, keine zusätzlich gekauften. Alle Stunts</text>
<text x="28" y="1478" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> sind neue Vorschläge für die Spielrunde.</text></svg>