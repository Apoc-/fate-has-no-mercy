<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1174" viewBox="0 0 640 1174">
<rect width="100%" height="100%" rx="16" fill="#f2e2bf"/>
<text x="28" y="40" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">NPC</text>
<text x="28" y="74" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="24" xml:space="preserve">Wade »Staub« Rusk</text>
<text x="28" y="100" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Goon / Mook · Profile</text>
<text x="28" y="126" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Movie Western · GM</text>
<text x="28" y="152" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="178" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">High Concept</text>
<text x="28" y="204" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Bezahlter Schütze, kein bezahlter Toter</text>
<text x="28" y="230" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="256" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Appearance / Manner</text>
<text x="28" y="282" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Ein staubgrauer Mantel, blank geriebene </text>
<text x="28" y="308" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Stiefelspitzen und ein Gewehrriemen, an dem er </text>
<text x="28" y="334" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">ständig zupft. Spricht erst, nachdem sein </text>
<text x="28" y="360" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Vorarbeiter gesprochen hat.</text>
<text x="28" y="386" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="412" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Goal</text>
<text x="28" y="438" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Die Güterschuppentür bis zur Ankunft des </text>
<text x="28" y="464" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Abendzugs bewachen. Für einen echten </text>
<text x="28" y="490" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Schusswechsel hat er sich nicht bezahlen lassen.</text>
<text x="28" y="516" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="542" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Skills</text>
<text x="28" y="568" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Shoot +1; unlisted +0.</text>
<text x="28" y="594" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="620" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Stress / Consequences / Stunts</text>
<text x="28" y="646" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Stress [1]. Alle Kästchen haben Wert 1; mehrere </text>
<text x="28" y="672" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">vorhandene Kästchen dürfen denselben Treffer </text>
<text x="28" y="698" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">abfangen. Consequences: None. Stunts: None. Mehr</text>
<text x="28" y="724" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> Shifts als abfangbarer Stress führen zu Taken </text>
<text x="28" y="750" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Out, nicht automatisch zum Tod.</text>
<text x="28" y="776" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="802" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Break Condition</text>
<text x="28" y="828" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Rusk zieht sich zurück, wenn er ohne Deckung </text>
<text x="28" y="854" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">allein gelassen wird, Vanes Auftrag offen als </text>
<text x="28" y="880" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Urkundenraub benannt wird oder er einen sicheren</text>
<text x="28" y="906" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> Ausweg erhält. Eine Flucht ist eine mögliche </text>
<text x="28" y="932" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Reaktion, kein erzwungenes Ergebnis jedes </text>
<text x="28" y="958" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Gesprächs.</text>
<text x="28" y="984" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="1010" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">GM Use</text>
<text x="28" y="1036" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Telegraphiere seine Unsicherheit über den Griff </text>
<text x="28" y="1062" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">am Gewehrriemen. Drohen, Bestechen, </text>
<text x="28" y="1088" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Vorbeischleichen oder Verhandeln sind ebenso </text>
<text x="28" y="1114" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">denkbar wie Gewalt. Kein eigener Refresh-Vorrat;</text>
<text x="28" y="1140" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> NPC-Invokes kommen aus dem GM scene pool.</text></svg>