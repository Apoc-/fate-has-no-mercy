<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1486" viewBox="0 0 640 1486">
<rect width="100%" height="100%" rx="16" fill="#f2e2bf"/>
<text x="28" y="40" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">NPC</text>
<text x="28" y="74" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="24" xml:space="preserve">Silas Vane</text>
<text x="28" y="100" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Major Opponent / BBEG · Stunts / GM Notes</text>
<text x="28" y="126" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Movie Western · GM</text>
<text x="28" y="152" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="178" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Stunt · Alles hat seinen Preis</text>
<text x="28" y="204" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">+2 auf Resources für Create an Advantage, wenn </text>
<text x="28" y="230" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Vane vor einer Operation konkret benannte </text>
<text x="28" y="256" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Transportmittel, Vorräte oder Unterkünfte </text>
<text x="28" y="282" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">beschafft. Benötigt eine Action und reale </text>
<text x="28" y="308" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Beschaffungsmöglichkeiten; erschafft keine Leute</text>
<text x="28" y="334" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> oder Vorräte augenblicklich.</text>
<text x="28" y="360" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="386" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Stunt · Meine Leute stehen überall</text>
<text x="28" y="412" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">+2 auf Contacts für Overcome, um entlang seiner </text>
<text x="28" y="438" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Bahnstrecke einen bereits bezahlten Mitarbeiter </text>
<text x="28" y="464" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">oder Informanten ausfindig zu machen. Kein </text>
<text x="28" y="490" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Fernbefehl, keine zusätzliche Action und kein </text>
<text x="28" y="516" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Schutz vor dessen Gewissensentscheidung.</text>
<text x="28" y="542" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="568" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Stunt · Die Wahrheit steht auf der Quittung</text>
<text x="28" y="594" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">+2 auf Deceive für Create an Advantage beim </text>
<text x="28" y="620" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Präparieren schriftlicher Geschäftsunterlagen </text>
<text x="28" y="646" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">als Alibi für eine bestimmte rechtswidrige </text>
<text x="28" y="672" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Handlung. Die Unterlagen müssen zugänglich sein;</text>
<text x="28" y="698" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> Zeugen und echte Gegenbelege bleiben </text>
<text x="28" y="724" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Gegenmaßnahmen.</text>
<text x="28" y="750" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="776" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Weaknesses / Counterplay</text>
<text x="28" y="802" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Erstens: Claras Frachtabschrift verbindet seine </text>
<text x="28" y="828" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Firma mit dem geplanten Zugriff; zusammen mit </text>
<text x="28" y="854" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">dem beglaubigten Register und einer unabhängigen</text>
<text x="28" y="880" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> Zeugenaussage lässt sich sein öffentliches </text>
<text x="28" y="906" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Alibi angreifen. Zweitens: Seine Männer kämpfen </text>
<text x="28" y="932" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">für Lohn. Eine abgesicherte Aussage, ein </text>
<text x="28" y="958" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">sicherer Rückzug oder ein echter Gegenauftrag </text>
<text x="28" y="984" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">kann ihre Bindung lösen. Keiner dieser Wege </text>
<text x="28" y="1010" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">erzwingt automatisch einen Erfolg.</text>
<text x="28" y="1036" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="1062" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">If Unopposed</text>
<text x="28" y="1088" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Vanes Vorarbeiter versucht am Bahnhof zuerst </text>
<text x="28" y="1114" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Bestechung und einen falschen Frachtbefehl, </text>
<text x="28" y="1140" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">danach einen verdeckten Diebstahl. Ein offener </text>
<text x="28" y="1166" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Angriff gefährdet Vanes Ruf und bleibt </text>
<text x="28" y="1192" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Eskalation, kein unvermeidlicher Filmhöhepunkt.</text>
<text x="28" y="1218" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="1244" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Concession / Escape</text>
<text x="28" y="1270" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Bei drohender öffentlicher Entlarvung könnte </text>
<text x="28" y="1296" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Vane das echte Register herausgeben, die </text>
<text x="28" y="1322" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Wasseransprüche vorläufig aufgeben und im </text>
<text x="28" y="1348" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Gegenzug eine garantierte Gerichtsverhandlung </text>
<text x="28" y="1374" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">statt einer Lynchjustiz verlangen. Vor dem </text>
<text x="28" y="1400" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">relevanten Roll aushandeln; kein automatisches </text>
<text x="28" y="1426" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Entkommen und kein einseitiges Streichen bereits</text>
<text x="28" y="1452" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> etablierter Folgen.</text></svg>