<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1408" viewBox="0 0 640 1408">
<rect width="100%" height="100%" rx="16" fill="#f2e2bf"/>
<text x="28" y="40" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">NPC</text>
<text x="28" y="74" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="24" xml:space="preserve">Silas Vane</text>
<text x="28" y="100" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Major Opponent / BBEG · Profile / Mechanics</text>
<text x="28" y="126" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Movie Western · GM</text>
<text x="28" y="152" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="178" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">High Concept</text>
<text x="28" y="204" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Der Mann, dem die Stadt auf dem Papier gehört</text>
<text x="28" y="230" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="256" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Trouble</text>
<text x="28" y="282" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Ich ertrage keinen Zeugen, den ich nicht kaufen </text>
<text x="28" y="308" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">kann</text>
<text x="28" y="334" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="360" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Relationship / Free Aspects</text>
<text x="28" y="386" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Die Stadt schuldet mir ihre Dächer / Meine </text>
<text x="28" y="412" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Unterschrift zahlt die Sterne / Selbst der Arzt </text>
<text x="28" y="438" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">stellte mir ihre Rechnung</text>
<text x="28" y="464" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="490" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Agenda / Methods</text>
<text x="28" y="516" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Vane will das beglaubigte Landregister vor einer</text>
<text x="28" y="542" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> öffentlichen Übergabe abfangen und durch eine </text>
<text x="28" y="568" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">unvollständige Kopie ersetzen. Mit </text>
<text x="28" y="594" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Schuldscheinen, Aufträgen und gekauften Zeugen </text>
<text x="28" y="620" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">lässt er Gewalt wie fremdes Handeln aussehen.</text>
<text x="28" y="646" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="672" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Personality / Connection</text>
<text x="28" y="698" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Er bietet zuerst einen Stuhl, dann einen Vertrag</text>
<text x="28" y="724" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> und zuletzt einen Ausweg an. Elena verdankt ihm</text>
<text x="28" y="750" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> eine frühere Arztrechnung; Clara schuldet ihm </text>
<text x="28" y="776" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Geld. Er hält Dankbarkeit und Eigentum für </text>
<text x="28" y="802" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">dasselbe, behauptet aber ernsthaft, ohne seine </text>
<text x="28" y="828" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Investitionen gäbe es die Stadt nicht.</text>
<text x="28" y="854" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="880" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Skills</text>
<text x="28" y="906" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Resources +5; Contacts +4, Will +4; Deceive +3, </text>
<text x="28" y="932" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Shoot +3, Physique +3; Notice +2, Fight +2, </text>
<text x="28" y="958" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Rapport +2, Athletics +2. Unlisted +0. </text>
<text x="28" y="984" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Beispielprofil für PC-Spitzen um +4, keine </text>
<text x="28" y="1010" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">pauschale Balance-Garantie.</text>
<text x="28" y="1036" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="1062" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Physical Stress / Mental Stress</text>
<text x="28" y="1088" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Physical [1][1][1][1][1][1] aus Physique +3. </text>
<text x="28" y="1114" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Mental [1][1][1][1][1][1] aus Will +4. Nur Ein-</text>
<text x="28" y="1140" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Punkt-Kästchen; mehrere pro Treffer möglich. </text>
<text x="28" y="1166" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Resources +5 verleiht keinen zusätzlichen mild </text>
<text x="28" y="1192" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Slot.</text>
<text x="28" y="1218" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="1244" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Consequences / Fate Points</text>
<text x="28" y="1270" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">mild 2 [empty]; moderate 4 [empty]; severe 6 </text>
<text x="28" y="1296" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">[empty], gemeinsame Slots. NPC-Invokes aus dem </text>
<text x="28" y="1322" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">GM scene pool. Kein eigener PC-Refresh-Vorrat, </text>
<text x="28" y="1348" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">keine automatischen Zusatzaktionen. Alle Stunts </text>
<text x="28" y="1374" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">sind neue Vorschläge für die Spielrunde.</text></svg>