<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1590" viewBox="0 0 640 1590">
<rect width="100%" height="100%" rx="16" fill="#f2e2bf"/>
<text x="28" y="40" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">NPC</text>
<text x="28" y="74" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="24" xml:space="preserve">Clara Bell</text>
<text x="28" y="100" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Standard NPC · Profile</text>
<text x="28" y="126" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Movie Western · GM</text>
<text x="28" y="152" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="178" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">High Concept</text>
<text x="28" y="204" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Die Wirtin hört mehr, als ihre Gäste erzählen</text>
<text x="28" y="230" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="256" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Trouble</text>
<text x="28" y="282" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Mein Bruder unterschrieb für den falschen Mann</text>
<text x="28" y="308" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="334" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Appearance / Manner</text>
<text x="28" y="360" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Hochgekrempelte Ärmel, ein Bleistift hinter dem </text>
<text x="28" y="386" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Ohr und ein stets sauberer Fleck auf der Theke. </text>
<text x="28" y="412" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Stellt ein Glas hin, bevor sie eine unangenehme </text>
<text x="28" y="438" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Frage stellt.</text>
<text x="28" y="464" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="490" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Want / Obstacle</text>
<text x="28" y="516" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Clara will ihren Bruder Tom, den Heizer des </text>
<text x="28" y="542" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Abendzugs, lebend aus Vanes Diensten lösen. Tom </text>
<text x="28" y="568" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">half beim Transport einer gefälschten </text>
<text x="28" y="594" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Besitzurkunde und fürchtet, als einziger Täter </text>
<text x="28" y="620" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">verurteilt zu werden.</text>
<text x="28" y="646" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="672" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Offer / Boundary</text>
<text x="28" y="698" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Bietet ein Zimmer über der Hintertreppe, </text>
<text x="28" y="724" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Nachrichten aus dem Saloon und eine Begegnung </text>
<text x="28" y="750" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">mit Tom ohne Vanes Vorarbeiter. Sie versteckt </text>
<text x="28" y="776" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Zeugen, aber keine Waffe bei einem ahnungslosen </text>
<text x="28" y="802" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Gast.</text>
<text x="28" y="828" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="854" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Relationship</text>
<text x="28" y="880" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Vane hält den Schuldschein des Saloons; Clara </text>
<text x="28" y="906" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">kennt dafür seine nächtlichen Besucher. Rusk </text>
<text x="28" y="932" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">durfte einmal bei ihr anschreiben und schämt </text>
<text x="28" y="958" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">sich, ihr heute die Augen zu verweigern.</text>
<text x="28" y="984" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="1010" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Skills / Stress</text>
<text x="28" y="1036" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Rapport +2, Notice +1; unlisted +0. Stress </text>
<text x="28" y="1062" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">[1][1], mehrere Ein-Punkt-Kästchen pro Treffer </text>
<text x="28" y="1088" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">möglich. Consequences: None. Stunts: None. </text>
<text x="28" y="1114" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Leichtgewichtiges minor-NPC-Profil, keine </text>
<text x="28" y="1140" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">automatisch abgeleiteten PC-Tracks.</text>
<text x="28" y="1166" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="1192" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">GM Knowledge</text>
<text x="28" y="1218" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Clara besitzt eine Kohlepapier-Abschrift des </text>
<text x="28" y="1244" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Frachtauftrags, auf dem Vanes Buchhalter die </text>
<text x="28" y="1270" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Übergabe des Landregisters anordnet. Das belegt </text>
<text x="28" y="1296" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">den geplanten Zugriff, nicht allein den </text>
<text x="28" y="1322" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">ursprünglichen Landbetrug. Sie zeigt die </text>
<text x="28" y="1348" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Abschrift bei glaubhafter Aussicht auf Schutz </text>
<text x="28" y="1374" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">für Tom.</text>
<text x="28" y="1400" fill="#715c46" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"></text>
<text x="28" y="1426" fill="#8a3f28" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Play Hook</text>
<text x="28" y="1452" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Als die Gäste ihr Kleingeld zählen, schiebt </text>
<text x="28" y="1478" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">Clara einen Fahrplan über die Theke: »Der Zug </text>
<text x="28" y="1504" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve">kommt bei Sonnenuntergang. Mein Bruder sitzt auf</text>
<text x="28" y="1530" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> der Lok. Und die Männer am Bahnhof warten nicht</text>
<text x="28" y="1556" fill="#30251d" font-family="DejaVu Sans Mono, monospace" font-size="16" xml:space="preserve"> auf Fahrgäste.«</text></svg>